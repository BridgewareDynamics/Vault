name: CI

on:
  push:
    branches:
      - main
      - prerelease
  # Run on every PR regardless of target branch so feature branches are gated.
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck:all

      - name: Run tests
        run: npm test

      - name: Check test coverage
        run: npm run test:coverage:ci

      - name: Build application
        run: npm run build:all
        env:
          NODE_ENV: production

  test-and-build-windows:
    # Pinned to windows-2022 (VS 2022 / v17). windows-latest now ships
    # Visual Studio 18 (2026), which the node-gyp bundled with
    # @electron/rebuild does not recognize, breaking the better-sqlite3
    # native rebuild in the postinstall step.
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck:all

      - name: Run tests
        run: npm test

      - name: Check test coverage
        run: npm run test:coverage:ci

      - name: Build application
        run: npm run build:all
        env:
          NODE_ENV: production
